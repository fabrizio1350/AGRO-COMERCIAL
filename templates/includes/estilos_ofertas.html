{% comment %}Estilos de frescura y de oferta normal/premium. Van dentro de la pagina para que se vean aunque el servidor tenga un tema.css viejo en cache.{% endcomment %}
<style>
/* ---------- Frescura: verde = fresco, amarillo = normal, gris = con más días ---------- */
.tarjeta-producto { border-top: 4px solid transparent; }
.tarjeta-producto.frescura-fresco { border-top-color: #16a34a; }
.tarjeta-producto.frescura-normal { border-top-color: #eab308; }
.tarjeta-producto.frescura-antiguo { border-top-color: #a8a29e; }
.chip-frescura {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: inline-flex; align-items: center; gap: 0.25rem;
    padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 700; line-height: 1.4;
    box-shadow: 0 4px 12px rgba(5, 46, 34, 0.15);
}
.chip-frescura.en-linea { position: static; box-shadow: none; vertical-align: middle; }
.chip-frescura.fresco { background: #dcfce7; color: #166534; }
.chip-frescura.normal { background: #fef9c3; color: #854d0e; }
.chip-frescura.antiguo { background: #f5f5f4; color: #57534e; }
.punto-frescura { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.3rem; vertical-align: middle; }
.punto-frescura.fresco { background: #16a34a; }
.punto-frescura.normal { background: #eab308; }
.punto-frescura.antiguo { background: #a8a29e; }
.leyenda-frescura { gap: 0.8rem; align-items: center; }
.tarjeta-producto.frescura-antiguo .foto img { filter: saturate(0.75); }

/* ---------- Etiqueta Oferta (arriba a la izquierda) ---------- */
.chip.chip-oferta { background: #f97316; color: #ffffff; }
.chip.chip-oferta.premium { background: linear-gradient(135deg, #f59e0b, #b45309); color: #ffffff; }
.tarjeta-producto .chip-foto { flex-wrap: wrap; max-width: calc(100% - 7.5rem); }

/* ---------- Elegir oferta normal o premium al pagar ---------- */
.planes-oferta { display: grid; gap: 0.6rem; }
@media (min-width: 576px) { .planes-oferta { grid-template-columns: 1fr 1fr; } }
.plan-oferta {
    display: flex; flex-direction: column; gap: 0.3rem; cursor: pointer;
    padding: 0.9rem 1rem; border: 2px solid #e7e5e4; border-radius: 14px; background: #ffffff;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.plan-oferta small { color: #57534e; }
.plan-oferta .precio-plan { font-weight: 800; font-size: 1.15rem; color: #15803d; }
.plan-oferta.premium strong { color: #b45309; }
.btn-check:checked + .plan-oferta { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15); }
.btn-check:checked + .plan-oferta.premium { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2); }
.btn-check:focus-visible + .plan-oferta { outline: 2px solid #15803d; outline-offset: 2px; }
@media (max-width: 575.98px) {
    /* En celular la frescura queda solo como un círculo de color con su ícono */
    .tarjeta-producto .chip-frescura { padding: 0.3rem; top: 8px; right: 8px; }
    .tarjeta-producto .chip-frescura .texto-frescura { display: none; }
    .tarjeta-producto .chip-foto { max-width: calc(100% - 3rem); top: 8px; left: 8px; }
}

/* ---------- Logo MercOfertas ---------- */
.logo-icono.logo-imagen { background: #ffffff !important; padding: 2px; overflow: hidden; box-shadow: 0 4px 12px -6px rgba(5, 46, 34, 0.45); }
.logo-icono.logo-imagen img { width: 100%; height: 100%; object-fit: contain; display: block; }
.logo-texto span { color: #f97316 !important; }
</style>
