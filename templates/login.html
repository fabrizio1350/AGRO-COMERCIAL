{% extends "presencial/base.html" %}
{% block content %}
<section class="encabezado"><h1>Bienvenido</h1></section>
<div class="formulario">
<div class="acciones"><a href="?modo=comprador">Quiero comprar</a><a href="?modo=vendedor">Soy vendedor</a></div>
<form method="post">
{% csrf_token %}
<input type="hidden" name="next" value="{{ request.GET.next }}">
<input type="hidden" name="modo_rol" value="{% if modo_acceso == 'vendedor' %}PRODUCTOR{% else %}COMPRADOR{% endif %}">
<div><label for="usuario">Correo o usuario</label><input id="usuario" name="username" autocomplete="username" required></div>
<div><label for="clave">Contraseña</label><input id="clave" type="password" name="password" autocomplete="current-password" required></div>
<button class="boton">Ingresar</button>
</form>
{% if google_client_id %}<p><a href="{% url 'login_google' %}?rol={% if modo_acceso == 'vendedor' %}PRODUCTOR{% else %}COMPRADOR{% endif %}">Continuar con Google</a></p>{% endif %}
<p><a href="{% url 'registro' %}?rol={% if modo_acceso == 'vendedor' %}PRODUCTOR{% else %}COMPRADOR{% endif %}">Crear una cuenta</a></p>
</div>
{% endblock %}
